<!-- Conversor de Moedas -->
<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Conversor de Moedas</title>
</head>

<body class="all">
    <img class="logo" src="./assets/logo.gif" alt="Logo do Conversor de Moedas" />

    <main class="container">
        <label class="select">
            Converter de

            <!-- O JavaScript coloca todas as moedas aqui. -->
            <select id="primeiroSelect1" class="Selectoption">
                <option value="">Carregando moedas...</option>
            </select>
        </label>

        <label class="select">
            Converter para

            <!-- O JavaScript coloca todas as moedas aqui também. -->
            <select id="segundoSelect2" class="Selectoption">
                <option value="">Carregando moedas...</option>
            </select>
        </label>

        <label class="valor">
            Valor

            <input id="inseriValor" class="inseriValor" type="number" min="0" step="0.01"
                placeholder="Digite o valor" />
        </label>

        <button id="buttonConverter" class="converterButton" type="button">
            Converter
        </button>

        <section class="resultado">
            <div class="divResultado">
                <p id="moedav1" class="moeda">Moeda de origem</p>
                <p id="valueinUser" class="resultadovalor">0,00</p>
            </div>

            <img class="indicador" src="./assets/Vector.png" alt="Indicador de conversão" />

            <div class="divResultado">
                <p id="moedav2" class="moeda">Moeda de destino</p>
                <p id="valueFinal" class="resultadovalor">0,00</p>
            </div>
        </section>
    </main>
</body>
<div id="modalErro" class="modal-overlay" hidden>
    <div class="modal">
        <h2>Atenção</h2>

        <p id="mensagemErro"></p>

        <button id="fecharModal" type="button">
            Entendi
        </button>
    </div>
</div>

<script src="script.js"></script>

</html>
