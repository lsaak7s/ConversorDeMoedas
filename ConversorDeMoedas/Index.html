<!-- Conversor de Moedas -->
<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Conversor de Moedas</title>
</head>

<body class="all">

    <main class="container">

        <h1 class="titulo">Conversor de Moedas</h1>
        <h2 class="tituloOrigem">Origem</h2>

        <div class="Origem">

            <!-- O JavaScript coloca todas as moedas aqui. -->
            <section class="labelValor">
                <p id="moedaOrigem" class="moeda">Moeda de origem</p>
                <input id="inputValor" class="inseriValor" type="number" min="0" step="0.01" placeholder="Origem" />
            </section>

            <div class="moeda">

                <select id="selectOrigem" class="primeiroSelect">
                    <option value="">Carregando moedas...</option>
                </select>

            </div>


        </div>

        <h2 class="tituloDestino">Destino</h2>

        <div class="Destino">

            <section class="labelValor">
                <p id="MoedaDestino" class="moeda">Moeda de destino</p>
                <p id="valueFinal" class="ValorFinal">0</p>
            </section>

            <div class="moeda">

                <select id="SelectDestino" class="segundoSelect">
                    <option value="">Carregando moedas...</option>
                </select>

            </div>

        </div>

        <button id="buttonConverter" class="converterButton" type="button"> Converter</button>


    </main>
</body>

<div id="modalErro" class="modal-overlay" hidden>

    <div class="modal">
        <h2>Atenção</h2>

        <p id="mensagemErro"></p>

        <button id="fecharModal" type="button">
            Entendi
        </button>
    </div>

</div>

<script src="script.js"></script>

</html>
