<!-- Conversor de Moedas -->
<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Conversor de Moedas</title>
</head>

<body class="all">
    <main class="container">

        <h1 class="titulo">Conversor de Moedas</h1>
        <h2 class="tituloOrigem">Origem</h2>

        <label class="Origem">

            <!-- O JavaScript coloca todas as moedas aqui. -->

            <section class="moedaOrigem">

                <label class="divResultado">
                    <input id="inseriValor" class="inseriValor" type="number" min="0" step="0.01"
                        placeholder="Digite o valor" />
                </label>


            </section>

            <select id="primeiroSelect1" class="PrimeiroSelect">
                <option class="Selectoption" value="">Carregando moedas...</option>
            </select>

        </label>

        <h2 class="tituloDestino">Destino</h2>

        <label class="Destino">

            <section class="moedaDestino">

                <div class="divResultado">
                    <p id="moedav2" class="moeda">Moeda de destino</p>
                    <p id="valueFinal" class="resultadovalor">0,00</p>
                </div>
            </section>

            <!-- O JavaScript coloca todas as moedas aqui também. -->
            <select id="segundoSelect2" class="segundoSelect">
                <option class="Selectoption" value="">Carregando moedas...</option>
            </select>

        </label>

        <button id="buttonConverter" class="converterButton" type="button"> Converter</button>


    </main>
</body>
