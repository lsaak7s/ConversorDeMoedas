<!-- Conversor de Moedas -->
<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Conversor de Moedas</title>
</head>

<body class="all">
    <img class="logo" src="./assets/logo.gif" alt="Logo do Conversor de Moedas" />

    <main class="container">
        <label class="select">
            Conversor <b>de</b>
            <select id="primeiroSelect1" class="Selectoption">
                <option value="real">R$ Real Brasileiro</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro Europeu</option>
            </select>
        </label>
        <h1></h1>
        <label class="select">
            Conversor <b>de</b>
            <select id="segundoSelect2" class="Selectoption">
                <option value="dolar">US$ Dólar Americano</option>
                <option value="real">R$ Real Brasileiro</option>
                <option value="euro">€ Euro Europeu</option>
                <option value="libra">£ Libra Esterlina</option>
            </select>
        </label>

        <label class="valor">
            Valor:
            <input id="inseriValor" class="inseriValor" type="number" placeholder=" R$ 10.000.00" />
        </label>

        <button id="buttonConverter" class="converterButton">Converter</button>

        <section class="resultado">
            <div class="divResultado">
                <img id="primeiraImg" src="./assets/BR.png" class="imgpaiz" />
                <p id="moedav1" class="moeda">Real</p>
                <p id="valueinUser" class="resultadovalor">R$ 0,00</p>
            </div>

            <img class="indicador" src="./assets/Vector.png" />

            <div class="divResultado">
                <img id="segundaImg" class="imgpaiz" src="./assets/EUA.png" />
                <p id="moedav2" class="moeda">Dólar</p>
                <p id="valueFinal" class="resultadovalor">US$ 0,00</p>
            </div>
        </section>
    </main>
</body>

<script src="script.js"></script>

</html>
