<!-- Conversor de Moedas -->
<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Conversor de Moedas</title>
</head>

<body class="all">


    <main class="container">


        <h1 class="tituloPrincipal">Veja a realidade</h1>
        <p class="tituloReal">1 Real Brasileiro E igual a </p>
        <h2 class="titulo">0.18 Dólar Americano</h2>



        <!-- <h2 class="tituloOrigem">Origem</h2>-->

        <div class="Origem">

            <!-- O JavaScript coloca todas as moedas aqui. -->

            <!--<p id="moedaOrigem" class="moeda">Moeda de origem</p>-->
            <input id="inputOrigem" class="inseriValor" type="number" min="0" step="0.01" placeholder="Origem" />



            <div class="moeda">

                <select id="selectOrigem" class="primeiroSelect">
                    <option value="">Carregando moedas...</option>
                </select>

            </div>


        </div>

        <!--<h2 class="tituloDestino">Destino</h2> <p id="valueFinal" class="ValorFinal">0</p>-->

        <div class="Destino">

            <section class="labelValor">
                <p id="valueFinal" class="ValorFinal">Destino</p>
            </section>


            <div class="moeda">


                <select id="SelectDestino" class="segundoSelect">
                    <option value="">Carregando moedas...</option>
                </select>

            </div>

        </div>


    </main>
</body>

<div id="modalErro" class="modal-overlay" hidden>

    <div class="modal">
        <h2>Atenção</h2>

        <p id="mensagemErro"></p>

        <button id="fecharModal" type="button">
            Entendi
        </button>
    </div>

</div>

<script src="script.js"></script>

</html>
